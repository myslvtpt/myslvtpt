<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SLV Carousel Admin</title><style>
:root{--navy:#102b3f;--teal:#12a99a;--paper:#f4f8f7;--line:#dfe9e6;--muted:#637581}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px/1.5 Inter,system-ui,sans-serif;color:#1c2e39}.wrap{width:min(960px,calc(100% - 32px));margin:45px auto}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 14px 45px #102b3f0c}h1,h2{color:var(--navy);letter-spacing:-.04em}h1{font-size:2rem;margin:0 0 6px}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}button,.btn{border:0;border-radius:999px;background:var(--teal);color:white;padding:12px 18px;font:700 14px inherit;cursor:pointer}button.danger{background:#a83e3e}button.secondary{background:var(--navy)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none!important}.slides{display:grid;gap:12px;margin-top:22px}.slide{display:grid;grid-template-columns:130px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);padding:12px;border-radius:14px}.slide img{width:130px;height:85px;object-fit:cover;border-radius:9px}.message{margin-top:12px;color:#087e72;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:var(--teal)}@media(max-width:600px){.wrap{margin:20px auto}.panel{padding:20px}.grid{grid-template-columns:1fr}.slide{grid-template-columns:90px 1fr}.slide img{width:90px;height:75px}.slide button{grid-column:1/-1}}
</style></head><body><main class="wrap">
<section class="panel" id="loginPanel"><h1>SLV Admin Login</h1><p class="muted">Sign in to manage homepage promotional slides.</p><form id="loginForm"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit">Sign in</button></p></form><div class="message" id="loginMessage" role="status"></div></section>
<section class="panel hidden" id="dashboard"><div class="top"><div><h1>Carousel dashboard</h1><p class="muted">Upload, preview and remove images shown on the homepage.</p></div><button class="secondary" id="logout">Sign out</button></div>
<form id="uploadForm"><div class="grid"><div><label for="image">Image (JPG, PNG, WEBP, GIF; max 2.5 MB)</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></div><div><label for="title">Slide heading</label><input id="title" maxlength="100" placeholder="Corporate meetings, made easy"></div></div><label for="description">Short caption</label><textarea id="description" rows="2" maxlength="200" placeholder="A short message for your visitors"></textarea><p><button type="submit">Upload slide</button></p></form><div class="message" id="uploadMessage" role="status"></div><h2>Current slides</h2><p class="muted">Slides display in upload order and rotate automatically every five seconds.</p><div class="slides" id="slides"></div></section>
</main><script>
const $=id=>document.getElementById(id);async function api(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed');return data}
function showDashboard(){ $('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');loadSlides()}
async function loadSlides(){const box=$('slides');box.textContent='Loading…';try{const data=await api('/api/carousel');box.replaceChildren();if(!data.slides.length){box.textContent='No slides uploaded yet.';return}data.slides.forEach(slide=>{const row=document.createElement('div');row.className='slide';const img=document.createElement('img');img.src=slide.url;img.alt='Carousel slide';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=slide.title;const desc=document.createElement('p');desc.className='muted';desc.textContent=slide.description;info.append(title,desc);const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.addEventListener('click',async()=>{if(!confirm('Delete this slide?'))return;try{await api('/api/carousel',{method:'DELETE',body:JSON.stringify({url:slide.url})});loadSlides()}catch(e){alert(e.message)}});row.append(img,info,del);box.append(row)})}catch(e){box.textContent=e.message}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMessage').textContent='Signing in…';try{await api('/api/carousel',{method:'POST',body:JSON.stringify({action:'login',username:$('username').value,password:$('password').value})});showDashboard()}catch(err){$('loginMessage').textContent=err.message}});
$('uploadForm').addEventListener('submit',async e=>{e.preventDefault();const file=$('image').files[0];if(!file)return;if(file.size>2.5*1024*1024){$('uploadMessage').textContent='Please choose an image smaller than 2.5 MB.';return}const reader=new FileReader();reader.onload=async()=>{try{$('uploadMessage').textContent='Uploading…';await api('/api/carousel',{method:'POST',body:JSON.stringify({image:reader.result,filename:file.name.replace(/\.[^.]+$/,''),title:$('title').value,description:$('description').value})});$('uploadMessage').textContent='Image uploaded successfully.';$('uploadForm').reset();loadSlides()}catch(err){$('uploadMessage').textContent=err.message}};reader.readAsDataURL(file)});
$('logout').addEventListener('click',async()=>{await api('/api/carousel',{method:'POST',body:JSON.stringify({action:'logout'})});$('dashboard').classList.add('hidden');$('loginPanel').classList.remove('hidden')});
api('/api/carousel?action=session').then(s=>{if(s.authenticated)showDashboard()}).catch(()=>{});
</script></body></html>
